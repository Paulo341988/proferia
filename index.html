<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Proféria</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center z-10 shrink-0">
        <div>
            <h1 class="text-xl font-bold"><i class="fas fa-graduation-cap mr-2"></i>Proféria</h1>
            <p class="text-xs text-indigo-200" id="currentDate">Hoje</p>
        </div>
        <button id="btnAlarmToggle" onclick="toggleAlarm()" class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center shadow-lg transition-colors">
            <i class="fas fa-bell text-lg"></i>
        </button>
    </header>

    <!-- Navegação Inferior -->
    <nav class="bg-white border-t border-gray-200 flex justify-around p-2 shrink-0 z-10 fixed bottom-0 w-full pb-safe">
        <button onclick="switchTab('schedule')" id="navSchedule" class="flex-1 flex flex-col items-center p-2 text-indigo-600">
            <i class="fas fa-calendar-alt text-xl mb-1"></i>
            <span class="text-xs font-semibold">Grade</span>
        </button>
        <button onclick="switchTab('notes')" id="navNotes" class="flex-1 flex flex-col items-center p-2 text-gray-400">
            <i class="fas fa-sticky-note text-xl mb-1"></i>
            <span class="text-xs font-semibold">Anotações</span>
        </button>
        <button onclick="switchTab('settings')" id="navSettings" class="flex-1 flex flex-col items-center p-2 text-gray-400">
            <i class="fas fa-list-check text-xl mb-1"></i>
            <span class="text-xs font-semibold">Cadastros</span>
        </button>
    </nav>

    <!-- Tela 1: Grade de Horários -->
    <main id="viewSchedule" class="flex-1 overflow-y-auto pb-20 hide-scrollbar bg-gray-50">
        <div class="bg-white shadow-sm sticky top-0 z-10 overflow-x-auto hide-scrollbar">
            <div class="flex p-2 min-w-max" id="daysContainer"></div>
        </div>
        <div id="classesList" class="p-4 space-y-3 pb-24"></div>
    </main>

    <!-- Tela 2: Anotações -->
    <main id="viewNotes" class="flex-1 overflow-y-auto pb-20 hidden bg-gray-50 p-4 pb-24">
        <h2 class="text-lg font-bold text-gray-700 mb-4">Minhas Anotações</h2>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <input type="text" id="noteTitle" placeholder="Título (ex: Reunião de Pais)" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-3 text-sm focus:outline-none focus:border-indigo-500">
            <textarea id="noteContent" rows="3" placeholder="Escreva sua anotação aqui..." class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
            <button onclick="addNote()" class="w-full bg-indigo-600 text-white rounded-xl py-3 font-bold text-sm shadow-md">Salvar Anotação</button>
        </div>
        <div id="notesList" class="space-y-3"></div>
    </main>

    <!-- Tela 3: Cadastros -->
    <main id="viewSettings" class="flex-1 overflow-y-auto pb-20 hidden bg-gray-50 p-4 pb-24">
        <h2 class="text-lg font-bold text-gray-700 mb-4">Gerenciar Cadastros</h2>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <div class="flex gap-2 mb-3">
                <button onclick="setRegType('turma')" id="btnRegTurma" class="flex-1 py-2 rounded-xl bg-indigo-100 text-indigo-700 font-bold text-sm">Turma</button>
                <button onclick="setRegType('disciplina')" id="btnRegDisc" class="flex-1 py-2 rounded-xl bg-gray-100 text-gray-500 font-bold text-sm">Disciplina</button>
            </div>
            <input type="text" id="regInput" placeholder="Ex: 1º Ano A" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-3 text-sm focus:outline-none focus:border-indigo-500">
            <button onclick="addRegistry()" class="w-full bg-indigo-600 text-white rounded-xl py-3 font-bold text-sm shadow-md">Adicionar</button>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div><h3 class="font-bold text-sm text-gray-500 mb-2">Turmas</h3><div id="listTurmas" class="space-y-2"></div></div>
            <div><h3 class="font-bold text-sm text-gray-500 mb-2">Disciplinas</h3><div id="listDisciplinas" class="space-y-2"></div></div>
        </div>
    </main>

    <!-- Modal Adicionar/Editar Aula -->
    <div id="classModal" class="fixed inset-0 bg-black/50 z-50 hidden flex-col justify-end">
        <div class="bg-white rounded-t-3xl p-5 shadow-2xl animate-[slideUp_0.3s_ease-out]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Aula em <span id="modalTime" class="text-indigo-600"></span></h2>
                <button onclick="closeModal()" class="text-gray-400 p-2 text-xl">&times;</button>
            </div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Turma</label>
            <select id="selectTurma" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-3 text-sm focus:outline-none focus:border-indigo-500"></select>
            <label class="block text-xs font-bold text-gray-500 mb-1">Disciplina</label>
            <select id="selectDisciplina" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-3 text-sm focus:outline-none focus:border-indigo-500"></select>
            <label class="block text-xs font-bold text-gray-500 mb-1">Lembrete rápido</label>
            <textarea id="inputNotas" rows="2" placeholder="Páginas, recados, lista de exercícios..." class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-4 text-sm focus:outline-none focus:border-indigo-500"></textarea>
            <button onclick="saveClass()" class="w-full bg-indigo-600 text-white rounded-xl py-3 font-bold text-sm shadow-md mb-2">Salvar Aula</button>
        </div>
    </div>

    <!-- Modal de Alerta de Próxima Aula -->
    <div id="alarmModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-sm text-center animate-[scaleIn_0.3s_ease-out]">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-bell text-3xl text-red-500 animate-bounce"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Aula Acabando!</h2>
            <p class="text-gray-600 mb-4">Faltam 5 minutos para o término.</p>
            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-6 text-left">
                <p class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-1">Sua Próxima Aula:</p>
                <p id="nextClassInfo" class="text-lg font-bold text-indigo-700"></p>
            </div>
            <button onclick="closeAlarmAlert()" class="w-full bg-indigo-600 text-white rounded-xl py-3 font-bold text-lg shadow-md">Ok, entendi!</button>
        </div>
    </div>

    <!-- Modal de Alerta Genérico -->
    <div id="customAlert" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 shadow-2xl w-full max-w-xs text-center animate-[scaleIn_0.2s_ease-out]">
            <h3 id="customAlertTitle" class="text-lg font-bold text-gray-800 mb-2">Atenção</h3>
            <p id="customAlertMsg" class="text-sm text-gray-600 mb-5"></p>
            <div class="flex gap-3 justify-center" id="customAlertBtns">
                <button onclick="closeCustomAlert()" class="flex-1 bg-indigo-600 text-white rounded-xl py-2 font-bold text-sm shadow-md">OK</button>
            </div>
        </div>
    </div>

    <script>
        const days = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
        const slots = [
            { id: 1, start: '07:30', end: '08:20', alarm: '08:15' },
            { id: 2, start: '08:20', end: '09:10', alarm: '09:05' },
            { id: 3, start: '09:10', end: '10:00', alarm: '09:55' },
            { id: 4, start: '10:20', end: '11:10', alarm: '11:05' },
            { id: 5, start: '11:10', end: '12:00', alarm: '11:55' },
            { id: 6, start: '12:00', end: '12:50', alarm: '12:45' }
        ];

        let currentDay = new Date().getDay();
        currentDay = (currentDay >= 1 && currentDay <= 5) ? currentDay - 1 : 0; 
        
        let appData = JSON.parse(localStorage.getItem('proferiaData')) || { classes: [], turmas: [], disciplinas: [], notes: [] };
        let currentRegType = 'turma';
        let editingTime = null;
        let alarmActive = localStorage.getItem('alarmActive') !== 'false';
        let alarmsTriggeredToday = {};
        let swRegistration = null;

        // Tocar um bipe sintético com a Web Audio API caso a tela esteja ligada
        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch(e) {}
        }

        function init() {
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            renderDays(); renderClasses(); renderRegistries(); renderNotes(); updateAlarmUI();
            setInterval(checkAlarms, 15000);
            
            // Solicitar permissão de notificação no Android
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === 'visible' && !document.getElementById('viewSchedule').classList.contains('hidden')) {
                    renderClasses();
                }
            });
        }

        let confirmCallback = null;
        function showConfirm(title, msg, onConfirm) {
            document.getElementById('customAlertTitle').innerText = title;
            document.getElementById('customAlertMsg').innerText = msg;
            confirmCallback = onConfirm;
            document.getElementById('customAlertBtns').innerHTML = `
                <button onclick="closeCustomAlert()" class="flex-1 bg-gray-200 text-gray-700 rounded-xl py-2 font-bold text-sm">Cancelar</button>
                <button onclick="executeConfirm()" class="flex-1 bg-red-500 text-white rounded-xl py-2 font-bold text-sm shadow-md">Confirmar</button>
            `;
            document.getElementById('customAlert').classList.remove('hidden');
            document.getElementById('customAlert').classList.add('flex');
        }
        function showAlert(title, msg) {
            document.getElementById('customAlertTitle').innerText = title;
            document.getElementById('customAlertMsg').innerText = msg;
            document.getElementById('customAlertBtns').innerHTML = `
                <button onclick="closeCustomAlert()" class="flex-1 bg-indigo-600 text-white rounded-xl py-2 font-bold text-sm shadow-md">OK</button>
            `;
            document.getElementById('customAlert').classList.remove('hidden');
            document.getElementById('customAlert').classList.add('flex');
        }
        function closeCustomAlert() { document.getElementById('customAlert').classList.add('hidden'); document.getElementById('customAlert').classList.remove('flex'); }
        function executeConfirm() { if(confirmCallback) confirmCallback(); closeCustomAlert(); }

        function switchTab(tab) {
            ['Schedule', 'Notes', 'Settings'].forEach(t => {
                document.getElementById('view' + t).classList.toggle('hidden', tab !== t.toLowerCase());
                document.getElementById('nav' + t).className = `flex-1 flex flex-col items-center p-2 ${tab === t.toLowerCase() ? 'text-indigo-600' : 'text-gray-400'}`;
            });
            if(tab === 'schedule') renderClasses();
        }

        function toggleAlarm() { 
            alarmActive = !alarmActive; 
            localStorage.setItem('alarmActive', alarmActive); 
            updateAlarmUI(); 
            if (alarmActive && "Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }
        function updateAlarmUI() {
            const btn = document.getElementById('btnAlarmToggle');
            btn.className = `w-10 h-10 rounded-full text-white flex items-center justify-center shadow-lg transition-colors ${alarmActive ? 'bg-green-500' : 'bg-red-500'}`;
        }
        function checkAlarms() {
            if (!alarmActive) return;
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            const dateStr = now.toLocaleDateString();
            slots.forEach((slot, index) => {
                const key = `${dateStr}-${slot.alarm}`;
                if (timeStr === slot.alarm && !alarmsTriggeredToday[key]) {
                    alarmsTriggeredToday[key] = true; 
                    triggerFullAlarm(index);
                }
            });
        }
        function triggerFullAlarm(idx) {
            const todayIdx = new Date().getDay() - 1; 
            if (todayIdx < 0 || todayIdx > 4) return;
            let nextInfo = "Fim do expediente.";
            if (idx + 1 < slots.length) {
                const nextSlot = slots[idx + 1];
                const nextData = appData.classes.find(c => c.day === days[todayIdx] && c.time === nextSlot.start);
                nextInfo = nextData ? `${nextSlot.start} - ${nextData.turma} (${nextData.disciplina})` : (idx === 2 ? "10:00 - Recreio" : `${nextSlot.start} - Livre`);
            }
            
            // 1. Modal e vibração interna
            document.getElementById('nextClassInfo').innerText = nextInfo;
            document.getElementById('alarmModal').classList.remove('hidden');
            document.getElementById('alarmModal').classList.add('flex');
            if(navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
            
            // 2. Toca o som local se a tela estiver aberta
            playBeepSound();

            // 3. Envia mensagem ao Service Worker para emitir notificação sonora nativa do Android (mesmo de tela fechada)
            if (swRegistration && swRegistration.active) {
                swRegistration.active.postMessage({
                    type: 'TRIGGER_ALARM',
                    body: `Faltam 5 min para o término! Próxima: ${nextInfo}`
                });
            }
        }
        function closeAlarmAlert() { document.getElementById('alarmModal').classList.add('hidden'); document.getElementById('alarmModal').classList.remove('flex'); }

        function renderDays() {
            const container = document.getElementById('daysContainer');
            container.innerHTML = days.map((day, i) => `
                <button onclick="currentDay=${i}; renderDays(); renderClasses();" class="px-5 py-2 mx-1 rounded-full text-sm font-bold transition-all ${i === currentDay ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-500 bg-gray-100'}">
                    ${day.substring(0, 3)}
                </button>
            `).join('');
        }

        function renderClasses() {
            const container = document.getElementById('classesList');
            container.innerHTML = '';
            const todayClasses = appData.classes.filter(c => c.day === days[currentDay]);
            
            const now = new Date();
            let isToday = false;
            const actualDayIndex = now.getDay() - 1;
            if (actualDayIndex >= 0 && actualDayIndex <= 4) {
                isToday = (currentDay === actualDayIndex);
            }
            const nowTime = now.getHours() * 60 + now.getMinutes();

            slots.forEach((slot, index) => {
                const cData = todayClasses.find(c => c.time === slot.start);
                const el = document.createElement('div');
                
                let bgClass = 'bg-white';
                let borderClass = 'border-gray-100';
                let badgeClass = 'bg-indigo-100 text-indigo-700';
                let emptyBgClass = 'bg-gray-50/50';
                let emptyBorderClass = 'border-gray-200';

                if (isToday) {
                    const [startH, startM] = slot.start.split(':').map(Number);
                    const [endH, endM] = slot.end.split(':').map(Number);
                    const startTime = startH * 60 + startM;
                    const endTime = endH * 60 + endM;

                    if (nowTime >= startTime && nowTime < endTime) {
                        bgClass = 'bg-green-50'; borderClass = 'border-green-400 border-2'; badgeClass = 'bg-green-200 text-green-800';
                        emptyBgClass = 'bg-green-50'; emptyBorderClass = 'border-green-300';
                    } else if (nowTime >= endTime) {
                        bgClass = 'bg-red-50 opacity-80'; borderClass = 'border-red-200'; badgeClass = 'bg-red-100 text-red-600';
                        emptyBgClass = 'bg-red-50 opacity-70'; emptyBorderClass = 'border-red-200';
                    }
                }

                if (cData) {
                    el.className = `${bgClass} p-4 rounded-2xl shadow-sm border ${borderClass} relative transition-all duration-300`;
                    el.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-bold ${badgeClass} px-2 py-1 rounded-md mb-2 inline-block shadow-sm"><i class="far fa-clock"></i> ${slot.start} - ${slot.end}</span>
                                <h3 class="font-bold text-gray-800 text-lg">${cData.turma}</h3>
                                <p class="text-sm text-gray-500">${cData.disciplina}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="openModal('${slot.start}')" class="w-8 h-8 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center"><i class="fas fa-pen text-xs"></i></button>
                                <button onclick="deleteClass(event, '${slot.start}')" class="w-8 h-8 bg-red-50 text-red-500 rounded-full flex items-center justify-center"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        </div>
                        ${cData.notas ? `<div class="mt-3 bg-white/60 border border-gray-100 p-2 rounded-lg text-xs text-gray-700 shadow-sm"><i class="fas fa-sticky-note text-yellow-500 mr-1"></i> ${cData.notas}</div>` : ''}
                    `;
                } else {
                    el.className = `border-2 border-dashed ${emptyBorderClass} p-4 rounded-2xl flex justify-between items-center ${emptyBgClass} transition-all duration-300`;
                    el.innerHTML = `
                        <div><span class="text-xs font-bold text-gray-400 block"><i class="far fa-clock"></i> ${slot.start} - ${slot.end}</span><span class="text-sm text-gray-400 font-medium">Livre</span></div>
                        <button onclick="openModal('${slot.start}')" class="bg-white border border-gray-200 text-indigo-600 px-4 py-2 rounded-xl text-xs font-bold shadow-sm">+ Adicionar</button>
                    `;
                }
                container.appendChild(el);
                
                if(index === 2) {
                    const recreio = document.createElement('div');
                    let recClass = 'text-gray-400';
                    if (isToday) {
                        if (nowTime >= 600 && nowTime < 620) recClass = 'text-green-500 animate-pulse';
                        else if (nowTime >= 620) recClass = 'text-red-400 opacity-60';
                    }
                    recreio.className = `flex items-center justify-center py-2 text-xs font-bold uppercase tracking-widest ${recClass}`;
                    recreio.innerHTML = '<i class="fas fa-mug-hot mr-2"></i> 10:00 - Recreio - 10:20 <i class="fas fa-mug-hot ml-2"></i>';
                    container.appendChild(recreio);
                }
            });
        }

        function openModal(time) {
            if(appData.turmas.length === 0 || appData.disciplinas.length === 0) {
                showAlert("Atenção", "Cadastre pelo menos uma turma e disciplina na aba Cadastros."); return;
            }
            editingTime = time;
            document.getElementById('modalTime').innerText = time;
            document.getElementById('selectTurma').innerHTML = appData.turmas.map(t => `<option value="${t}">${t}</option>`).join('');
            document.getElementById('selectDisciplina').innerHTML = appData.disciplinas.map(d => `<option value="${d}">${d}</option>`).join('');
            
            const existing = appData.classes.find(c => c.day === days[currentDay] && c.time === time);
            if(existing){
                document.getElementById('selectTurma').value = existing.turma;
                document.getElementById('selectDisciplina').value = existing.disciplina;
                document.getElementById('inputNotas').value = existing.notas || '';
            } else { document.getElementById('inputNotas').value = ''; }
            
            document.getElementById('classModal').classList.remove('hidden');
            document.getElementById('classModal').classList.add('flex');
        }
        function closeModal() { document.getElementById('classModal').classList.add('hidden'); document.getElementById('classModal').classList.remove('flex'); editingTime = null; }

        function saveClass() {
            const turma = document.getElementById('selectTurma').value;
            const disciplina = document.getElementById('selectDisciplina').value;
            const notas = document.getElementById('inputNotas').value.trim();
            appData.classes = appData.classes.filter(c => !(c.day === days[currentDay] && c.time === editingTime));
            appData.classes.push({ day: days[currentDay], time: editingTime, turma, disciplina, notas });
            saveData(); closeModal(); renderClasses();
        }
        function deleteClass(e, time) {
            e.stopPropagation();
            showConfirm("Excluir", "Remover esta aula?", () => {
                appData.classes = appData.classes.filter(c => !(c.day === days[currentDay] && c.time === time));
                saveData(); renderClasses();
            });
        }

        function addNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            if(!title || !content) { showAlert("Atenção", "Preencha título e conteúdo."); return; }
            const date = new Date().toLocaleDateString('pt-BR');
            appData.notes.unshift({ id: Date.now(), title, content, date });
            saveData(); document.getElementById('noteTitle').value=''; document.getElementById('noteContent').value=''; renderNotes();
        }
        function deleteNote(id) {
            showConfirm("Excluir", "Apagar anotação?", () => {
                appData.notes = appData.notes.filter(n => n.id !== id); saveData(); renderNotes();
            });
        }
        function renderNotes() {
            document.getElementById('notesList').innerHTML = appData.notes.map(n => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 relative">
                    <button onclick="deleteNote(${n.id})" class="absolute top-4 right-4 text-red-400"><i class="fas fa-trash"></i></button>
                    <h3 class="font-bold text-gray-800 pr-6">${n.title}</h3>
                    <p class="text-xs text-gray-400 mb-2">${n.date}</p>
                    <p class="text-sm text-gray-600 whitespace-pre-wrap">${n.content}</p>
                </div>
            `).join('');
            if(appData.notes.length === 0) document.getElementById('notesList').innerHTML = '<p class="text-center text-gray-400 text-sm py-4">Nenhuma anotação.</p>';
        }

        function setRegType(t) {
            currentRegType = t;
            document.getElementById('btnRegTurma').className = `flex-1 py-2 rounded-xl font-bold text-sm ${t==='turma'?'bg-indigo-100 text-indigo-700':'bg-gray-100 text-gray-500'}`;
            document.getElementById('btnRegDisc').className = `flex-1 py-2 rounded-xl font-bold text-sm ${t==='disciplina'?'bg-indigo-100 text-indigo-700':'bg-gray-100 text-gray-500'}`;
            document.getElementById('regInput').placeholder = t==='turma'?'Ex: 1º Ano A':'Ex: Matemática';
        }
        function addRegistry() {
            const val = document.getElementById('regInput').value.trim();
            if(!val) return;
            const target = currentRegType === 'turma' ? appData.turmas : appData.disciplinas;
            if(!target.includes(val)) { target.push(val); saveData(); renderRegistries(); document.getElementById('regInput').value=''; }
        }
        function removeRegistry(t, val) {
            showConfirm("Atenção", `Excluir ${val}?`, () => {
                if(t==='turma') appData.turmas = appData.turmas.filter(x => x !== val);
                else appData.disciplinas = appData.disciplinas.filter(x => x !== val);
                saveData(); renderRegistries();
            });
        }
        function renderRegistries() {
            const render = (arr, t, el) => {
                document.getElementById(el).innerHTML = arr.map(i => `
                    <div class="flex justify-between items-center bg-white p-2 px-3 rounded-lg border border-gray-100 shadow-sm text-sm">
                        <span class="font-medium truncate">${i}</span>
                        <button onclick="removeRegistry('${t}', '${i}')" class="text-red-400"><i class="fas fa-times"></i></button>
                    </div>
                `).join('');
            };
            render(appData.turmas, 'turma', 'listTurmas');
            render(appData.disciplinas, 'disciplina', 'listDisciplinas');
        }

        function saveData() { localStorage.setItem('proferiaData', JSON.stringify(appData)); }
        
        init();
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => { swRegistration = reg; })
                    .catch(err => console.log('SW Error: ', err));
            });
        }
    </script>
</body>
</html>
